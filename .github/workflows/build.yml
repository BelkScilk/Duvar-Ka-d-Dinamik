
name: Gunduz Gece APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodlari indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK hazirla
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDKMANAGER bulunamadi!"
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: ZIP ac ve APK derle
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ZIP dosyasi bulunamadi!"
            exit 1
          fi

          mkdir -p _src
          unzip -q -o "$ZIP" -d _src

          SETTINGS=$(find _src -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle bulunamadi!"
            exit 1
          fi

          cd "$(dirname "$SETTINGS")"

          gradle assembleDebug --stacktrace

          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/gunduz-gece.apk"

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: gunduz-gece-apk
          path: gunduz-gece.apk
          
