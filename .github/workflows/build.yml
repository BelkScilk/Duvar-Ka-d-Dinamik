
name: Gündüz Gece APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodlari indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android lisanslarini kabul et
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: ZIP ac ve APK derle
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP"
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src

          SETTINGS=$(find _src -name settings.gradle -o -name settings.gradle.kts | head -1)
          test -n "$SETTINGS"

          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --stacktrace

          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/gunduz-gece.apk"

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: gunduz-gece-apk
          path: gunduz-gece.apk
          
